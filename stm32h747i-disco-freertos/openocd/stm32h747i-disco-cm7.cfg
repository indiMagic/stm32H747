# OpenOCD config: STM32H747I-DISCO onboard ST-LINK, Cortex-M7 core only.
# Run from internal flash, so the board file's QSPI/reset-init clock hack is not needed.

source [find interface/stlink.cfg]
transport select hla_swd

set CHIPNAME stm32h747xih6
set DUAL_BANK 1          ;# expose flash bank 2 as well (0x08100000)
source [find target/stm32h7x_dual_bank.cfg]

reset_config srst_only
adapter speed 4000
